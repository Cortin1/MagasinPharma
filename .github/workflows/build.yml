name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean workspace and unpack project zip
        run: |
          zipfile="MagasinPharma-project.zip"
          if [ ! -f "$zipfile" ]; then
            echo "MagasinPharma-project.zip not found in repo root. Files present:"
            ls -la
            exit 1
          fi
          echo "Building from: $zipfile"
          cp "$zipfile" /tmp/project.zip
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          unzip -oq /tmp/project.zip -d /tmp/unzipped
          innerdir=$(ls /tmp/unzipped | head -n 1)
          cp -rf "/tmp/unzipped/$innerdir/." .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: magasinpharma-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
